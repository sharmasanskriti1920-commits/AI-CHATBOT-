<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
    }
    .chat-container {
      width: 90%;
      max-width: 500px;
      height: 80vh;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      background: #667eea;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
    }
    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f5f5f5;
    }
    .message {
      margin-bottom: 15px;
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 75%;
      word-wrap: break-word;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .user { 
      background: #667eea; 
      color: white; 
      margin-left: auto; 
      border-bottom-right-radius: 5px;
    }
    .bot { 
      background: white; 
      color: #333; 
      margin-right: auto; 
      border-bottom-left-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .chat-input {
      display: flex;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
    }
    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #ddd;
      border-radius: 25px;
      outline: none;
      font-size: 14px;
    }
    .chat-input input:focus { border-color: #667eea; }
    .chat-input button {
      margin-left: 10px;
      padding: 12px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
    }
    .chat-input button:hover { background: #5568d3; }
    .chat-input button:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body><div style="max-width: 500px; margin: 40px auto; text-align: center;">
  <h2>🤖 AI Chatbot</h2>
  <iframe 
    src="https://ai-chatbot-j9w8.onrender.com" 
    style="width: 100%; height: 600px; border: 1px solid #ddd; border-radius: 12px;">
  </iframe>
</div>
  </body>
</html>
